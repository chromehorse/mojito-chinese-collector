name: Chinese collector

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_private:
        description: Send validated text to private intake
        type: boolean
        default: false
      verify_access:
        description: Verify private repository read and write access without collecting
        type: boolean
        default: false
      recipes:
        description: Comma-separated recipe IDs that failed the regular local scraper
        type: string
      edition:
        description: A registered historical edition for one failed publisher
        type: string
      verify_epaper:
        description: Use two fixed public e-paper editions for an end-to-end test
        type: boolean
        default: false
      verify_epaper_history:
        description: Test two official January 2026 e-paper editions
        type: boolean
        default: false

permissions: {}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Python syntax
        run: |
          git init -q
          git fetch -q --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          python3 -m compileall -q chinese_collector.py chinese_collector_handoff.py run.py scraper

  probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'chromehorse/mojito-chinese-collector' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: collector-intake
      cancel-in-progress: false
    environment: private-intake
    steps:
      - name: Retrieve trusted collector code
        run: |
          git init -q
          git fetch -q --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Prepare the unprivileged collector container
        if: ${{ !inputs.verify_access }}
        run: docker build -t mojito-chinese-collector .

      - name: Capture the selected fallback sources
        if: ${{ !inputs.verify_access }}
        id: probe
        continue-on-error: true
        env:
          FALLBACK_RECIPES: ${{ inputs.recipes }}
          VERIFY_EPAPER: ${{ inputs.verify_epaper }}
          VERIFY_EPAPER_HISTORY: ${{ inputs.verify_epaper_history }}
          HISTORICAL_EDITION: ${{ inputs.edition }}
        run: |
          if [[ ! "$FALLBACK_RECIPES" =~ ^[a-z0-9_-]+(,[a-z0-9_-]+)*$ ]]; then
            printf '{"status":"missing_or_invalid_recipes"}\n'
            exit 1
          fi
          IFS=, read -ra recipes <<< "$FALLBACK_RECIPES"
          selected=()
          epaper=false
          ethics_copy=false
          for recipe in "${recipes[@]}"; do
            case "$recipe" in
              pd_commentary|pd_zhongsheng) epaper=true ;;
              moa_ai_ethics) ethics_copy=true ;;
              *) selected+=(--recipe "$recipe") ;;
            esac
          done
          if [[ -n "$HISTORICAL_EDITION" ]]; then
            if [[ ! "$HISTORICAL_EDITION" =~ ^[a-z0-9_-]+$ ]] || ((${#selected[@]} != 2 || ${#recipes[@]} != 1)); then
              printf '{"status":"invalid_historical_edition_selection"}\n'
              exit 1
            fi
            selected+=(--edition "$HISTORICAL_EDITION")
          fi
          install -d -m 700 "$RUNNER_TEMP/collector-state"
          container=(--rm --read-only --cap-drop=ALL --security-opt=no-new-privileges
            --memory=1024m --pids-limit=64 --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --mount "type=bind,source=$RUNNER_TEMP/collector-state,destination=/data")
          result=0
          if ((${#selected[@]})); then
            docker run "${container[@]}" mojito-chinese-collector collect --data /data \
              --summary-only --cap 4 "${selected[@]}" || result=$?
          fi
          if "$epaper"; then
            dates=()
            if [ "$VERIFY_EPAPER_HISTORY" = true ] && [ "$VERIFY_EPAPER" = true ]; then
              printf '{"status":"conflicting_epaper_tests"}\n'
              exit 1
            fi
            if [ "$VERIFY_EPAPER" = true ]; then dates=(--verify-controls 2026-11-17 2026-09-16); fi
            if [ "$VERIFY_EPAPER_HISTORY" = true ]; then dates=(--verify-controls 2026-01-05 2026-01-09); fi
            docker run "${container[@]}" \
              --mount "type=bind,source=$GITHUB_WORKSPACE/pd_epaper.py,destination=/collector/pd_epaper.py,readonly" \
              --entrypoint python mojito-chinese-collector -B /collector/pd_epaper.py "${dates[@]}" || result=$?
          fi
          if "$ethics_copy"; then
            timeout --signal=TERM 180s docker run "${container[@]}" \
              --mount "type=bind,source=$GITHUB_WORKSPACE/miit_ethics_copy.py,destination=/collector/miit_ethics_copy.py,readonly" \
              --entrypoint python mojito-chinese-collector -B /collector/miit_ethics_copy.py /data || result=$?
          fi
          exit "$result"

      - name: Send text to the private intake repo
        if: ${{ !cancelled() && (inputs.publish_private || inputs.verify_access) }}
        env:
          INTAKE_UPLOAD_TOKEN: ${{ secrets.INTAKE_UPLOAD_TOKEN }}
          VERIFY_ACCESS: ${{ inputs.verify_access }}
        run: |
          operation=push
          if [ "$VERIFY_ACCESS" = true ]; then operation=check-write; fi
          python3 -B chinese_collector_handoff.py "$operation" \
            --repository chromehorse/mojito-chinese-intake --directory "$RUNNER_TEMP/collector-state"

      - name: Report publisher probe failures
        if: ${{ !cancelled() && steps.probe.outcome == 'failure' }}
        run: exit 1
