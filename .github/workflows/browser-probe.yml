name: Isolated browser source test

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Browser-dependent recipe whose local route failed
        type: choice
        options: [gov_policy_db, zrbzf_yanjiu, kxjszx_yanjiu]
        default: gov_policy_db

permissions: {}

jobs:
  browser:
    if: >-
      github.repository == 'chromehorse/mojito-chinese-collector' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Retrieve trusted collector code
        run: |
          git init -q
          git fetch -q --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Prepare the pinned renderer on the disposable VM
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-runtime"
          "$RUNNER_TEMP/browser-runtime/bin/python" -m pip install --only-binary=:all: -r requirements.txt playwright==1.64.1
      - name: Test one approved publisher with the Chromium sandbox enabled
        env:
          RECIPE: ${{ inputs.recipe }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/browser-home" "$RUNNER_TEMP/browser-state"
          timeout --signal=TERM 300s env -i HOME="$RUNNER_TEMP/browser-home" PATH=/usr/bin:/bin \
            LANG=C.UTF-8 COLLECTOR_BROWSER=chrome \
            "$RUNNER_TEMP/browser-runtime/bin/python" -B browser_capture.py "$RECIPE" "$RUNNER_TEMP/browser-state/output"
